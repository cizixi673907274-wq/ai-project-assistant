packages:
  - apps/*
  - packages/*
overrides:
  '@tarojs/binding': 'link:packages/taro-binding-stub'
  '@tarojs/plugin-doctor': 'link:packages/taro-plugin-doctor-stub'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
confirmModulesPurge: false
verifyDepsBeforeRun: false
