name: ai-project-assistant-prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_field
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 配置 POSTGRES_PASSWORD}
      POSTGRES_DB: ai_field
    volumes: [postgres-prod-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_field -d ai_field"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}"]
    volumes: [redis-prod-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请配置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请配置 MINIO_SECRET_KEY}
    volumes: [minio-prod-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    image: ai-project-assistant-api:latest
    build: ./apps/api
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ai_field:${POSTGRES_PASSWORD}@postgres:5432/ai_field
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert data['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
  worker:
    image: ai-project-assistant-api:latest
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ai_field:${POSTGRES_PASSWORD}@postgres:5432/ai_field
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      TASK_QUEUE_MODE: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_healthy}
    command: python -m app.worker
  admin-web:
    build:
      context: .
      dockerfile: infra/docker/admin-web.Dockerfile
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    # 8080 仅供服务器本机验收或前置 HTTPS 网关回源，不直接暴露到公网。
    ports: ["127.0.0.1:8080:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-prod-data:
  redis-prod-data:
  minio-prod-data:
