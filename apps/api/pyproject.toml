[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-field-api"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.20,<1",
  "minio>=7.2,<8", "redis>=5.2,<7", "httpx>=0.28,<1", "email-validator>=2.2,<3",
  "python-docx>=1.1,<2", "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
